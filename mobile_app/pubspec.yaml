name: never_ending_quest
description: A polished, AI-powered Dungeon Master for tabletop RPGs.
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.1
  web_socket_channel: ^2.4.5
  
  # Local Storage (Offline-first)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2

  # Voice & Interaction
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5
  haptic_feedback: ^0.5.1
  
  # UI & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  font_awesome_flutter: ^10.7.0
  flutter_spinkit: ^5.2.1
  animations: ^2.0.1
  
  # Utilities
  shared_preferences: ^2.2.2
  json_annotation: ^4.8.1
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.8
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.3.11
  json_serializable: ^6.7.1

dependency_overrides:
  objective_c:
    path: ../dummy_objective_c

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/audio/
